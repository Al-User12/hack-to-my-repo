name: 🌍 Translation
description: Add or improve a translation of the README
title: "[Translation]: "
labels: ["translation"]
body:
  - type: markdown
    attributes:
      value: |
        Help us make this project accessible in more languages!
  - type: input
    id: language
    attributes:
      label: Language
      description: Which language? Include the language code if you know it.
      placeholder: "Bahasa Indonesia (id)"
    validations:
      required: true
  - type: dropdown
    id: type
    attributes:
      label: Type
      options:
        - Add a new translation
        - Fix / improve an existing translation
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What needs to be added or corrected?
    validations:
      required: false
  - type: checkboxes
    id: willing
    attributes:
      label: Would you like to work on it?
      options:
        - label: I'd like to submit this translation myself
          required: false
