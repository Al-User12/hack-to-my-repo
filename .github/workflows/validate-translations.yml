name: Validate Translations

on:
  pull_request:
    paths:
      - "translations/**"
      - "tools/**"
      - ".github/workflows/validate-translations.yml"
  push:
    branches: [master]
    paths:
      - "translations/**"
      - "tools/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run translation validator
        run: python tools/validate_translations.py
