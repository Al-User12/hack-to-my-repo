name: PR Contributor Quality Comment

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Contributors.md"

permissions:
  contents: read
  pull-requests: read
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}

      - name: Fetch PR Contributors.md safely
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, urllib.request
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['PR_HEAD_SHA']
          token = os.environ['GH_TOKEN']
          url = f'https://api.github.com/repos/{repo}/contents/Contributors.md?ref={sha}'
          req = urllib.request.Request(url, headers={
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json',
          })
          with urllib.request.urlopen(req, timeout=30) as r:
              data = json.loads(r.read())
          content = base64.b64decode(data['content'])
          open('Contributors.md', 'wb').write(content)
          PY

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run PR Quality Bot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/pr_quality_comment.py
